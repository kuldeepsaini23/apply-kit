<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<link rel="stylesheet" href="../ui.css">
<style>
  body { width: 380px; margin: 16px; outline: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 13px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card { padding: 12px; margin-bottom: 10px; border-radius: 14px; }
  .sec { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); margin-bottom: 8px; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--muted); border: 1px solid var(--border); }
  .seg button { height: 22px; padding: 0 8px; border: 0; background: none; border-radius: 7px; font: 500 11.5px var(--font-sans); color: var(--muted-foreground); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .score { font: 700 34px/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-width: 56px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; margin-top: 5px; }
  .bar .progress { height: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  #result, #aiscore { margin-top: 10px; font-size: 12px; white-space: pre-line; color: var(--muted-foreground); }
  .ans { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); }
  .ans:first-child { border-top: 0; padding-top: 0; }
  .legend { display: flex; gap: 10px; margin-top: 10px; font-size: 11.5px; color: var(--muted-foreground); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  textarea.input { min-height: 120px; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  </svg>

  <div class="head">
    <div class="logo key-brand">AK</div>
    <span class="display" style="font-weight:700;font-size:15px">Apply Kit</span>
    <span class="badge" id="srvbadge" title="Claude server"><span class="dot" id="srv"></span><span id="srvtext">Claude</span></span>
    <span class="grow"></span>
    <div class="seg" title="Salary answers in"><button id="inr">₹ INR</button><button id="usd">$ USD</button></div>
    <a class="btn sm ghost icon" href="http://localhost:4777" target="_blank" title="Open dashboard"><svg class="i"><use href="#i-grid"/></svg></a>
  </div>

  <div class="card">
    <button class="btn lg block" id="fill"><svg class="i"><use href="#i-pen"/></svg>Fill this form<span class="kbd" style="margin-left:auto">Alt+Shift+F</span></button>
    <button class="btn brand lg block" id="aifill" style="margin-top:8px"><svg class="i"><use href="#i-spark"/></svg>Fill + Claude answers<span class="kbd" style="margin-left:auto">Alt+Shift+A</span></button>
    <div class="legend"><span><i style="background:#22c55e"></i>filled</span><span><i style="background:#f59e0b"></i>check</span><span><i style="background:#a855f7"></i>Claude</span><span style="margin-left:auto">never submits</span></div>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="sec">Interview chance</div>
    <div class="row" style="gap:12px;align-items:flex-start">
      <div class="score" id="score">–</div>
      <div class="grow" id="bars"></div>
    </div>
    <div class="tags" id="tags"></div>
    <div class="muted xs" id="scorenote" style="margin-top:8px">Quick estimate. Works best on the job description page.</div>
    <div class="row" style="margin-top:10px">
      <button class="btn ai sm grow" id="aiscorebtn"><svg class="i"><use href="#i-target"/></svg>Claude score</button>
      <button class="btn ai sm grow" id="dmbtn"><svg class="i"><use href="#i-send"/></svg>DM + email</button>
    </div>
    <div id="aiscore"></div>
    <textarea class="input" id="dmout" hidden></textarea>
  </div>

  <div class="card">
    <div class="sec">Log application</div>
    <div class="row"><input class="input" id="company" placeholder="Company" style="height:32px"><input class="input" id="role" placeholder="Role" style="height:32px"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn brand sm grow" id="log"><svg class="i"><use href="#i-check"/></svg>Log as applied</button>
      <button class="btn sm" id="copylog"><svg class="i"><use href="#i-copy"/></svg>Rows</button>
      <button class="btn sm ghost" id="clear" title="Clear the local log">✕</button>
    </div>
    <div class="muted xs" id="logcount" style="margin-top:8px"></div>
  </div>

  <div class="card muted xs" id="srvhelp" hidden>Claude server is off. Double-click <b>start-server.cmd</b> in the extension folder, then reopen this popup.</div>

  <div class="card">
    <div class="sec">Answers · click to copy</div>
    <div id="answers"></div>
  </div>

  <script src="../profile.example.js"></script>
<script>
// Preview only: fake Chrome APIs with a sample Composio job page.
const JD = "Composio Member of Technical Staff, Applied AI Engineer. Bengaluru. 2-4 years of experience. TypeScript, Node.js, React, Postgres, AWS. Build tool-using AI agents, evals, LLM workflows. Series A. ".repeat(4);
let store = { currency: "INR", log: [{ date: "2026-10-05", company: "Acme", role: "Engineer", url: "", score: "" }] };
const realFetch = fetch; window.fetch = (u, o) => String(u).endsWith("/api/health") ? Promise.resolve(new Response(JSON.stringify({ ok: true }))) : realFetch(u, o);
window.chrome = {
  tabs: { query: async () => [{ id: 1, url: "https://jobs.ashbyhq.com/composio/a4046674/application" }] },
  storage: { local: { get: async (k) => ({ [k]: store[k] }), set: async (o) => Object.assign(store, o) } },
  runtime: { getURL: (p) => "../" + p },
  scripting: { executeScript: async ({ func, args }) => {
    const src = String(func || "");
    if (src.includes("pageInfo")) return [{ frameId: 0, result: { company: "Composio", role: "Applied AI Engineer", url: "https://jobs.ashbyhq.com/composio/a4046674/application", text: JD } }];
    if (src.includes("score")) return [{ frameId: 0, result: globalThis.__applyKit.score(args[0]) }];
    return [{ frameId: 0, result: null }];
  } },
};
</script>
<script src="../fill.js"></script>
  <script type="module" src="../popup.js"></script>
</body>
</html>
