<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 12px; font-size: 13px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bar { position: sticky; top: 0; z-index: 2; padding: 8px 0 10px; background: var(--background); }
  .progress { height: 6px; margin-top: 8px; }
  .f { padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); scroll-margin-top: 90px; }
  .f.on { border-color: #3b82f6; box-shadow: 0 0 0 2px rgb(59 130 246 / .25); }
  .f.done { opacity: .55; }
  .f.done .q::before { content: "✓ "; color: var(--success-ink); }
  .q { font-weight: 600; line-height: 1.35; }
  .q .req { color: var(--danger); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .opts { font-size: 11.5px; color: var(--muted-foreground); margin: 4px 0 6px; }
  .opts b { color: var(--foreground); }
  textarea.input { width: 100%; min-height: 34px; font-size: 12.5px; resize: vertical; field-sizing: content; max-height: 260px; }
  .acts { display: flex; gap: 6px; margin-top: 6px; }
  .empty { padding: 24px 8px; text-align: center; color: var(--muted-foreground); }
  .filter { display: flex; gap: 10px; font-size: 12px; color: var(--muted-foreground); margin-top: 8px; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo key-brand">AK</div>
    <span class="display" style="font-weight:700;font-size:15px">Guided mode</span>
    <span class="grow"></span>
    <button class="btn sm" id="scan" title="Read the form on the current tab again">Rescan</button>
  </div>
  <div class="bar">
    <div class="row" style="gap:6px">
      <button class="btn ai sm grow" id="claude">Claude: answer blanks</button>
      <button class="btn sm" id="next" title="Jump to the next field that isn't done">Next field</button>
    </div>
    <div class="progress"><b id="prog" style="width:0%"></b></div>
    <div class="filter"><span id="count">–</span><span class="grow"></span><label><input type="checkbox" id="hideDone"> hide done</label></div>
  </div>
  <div id="list"><div class="empty">Open an application form, then press Rescan.</div></div>
  <p class="muted xs" style="margin-top:10px">Nothing is filled or submitted. Copy an answer, click the field (outlined blue) and paste. Copy marks the row done.</p>
  <script src="profile.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
